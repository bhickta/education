version: 0.0
os: linux
files:
  - source: /
    destination: /tmp/codedeploy-education
    overwrite: yes
hooks:
  BeforeInstall:
    - location: scripts/codedeploy/cleanup.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: scripts/codedeploy/deploy.sh
      timeout: 1800
      runas: root
  ValidateService:
    - location: scripts/codedeploy/healthcheck.sh
      timeout: 300
      runas: root
